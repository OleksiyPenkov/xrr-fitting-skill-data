<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920px" height="620px" viewBox="0 0 920 620" version="1.1"><title>Flow of sessions through both campaigns</title><desc>Campaign 1 Co/C qualification and Campaign 2 Ru/C transfer, with the reference fits each session was compared against.</desc><rect x="0" y="0" width="920" height="620" fill="#ffffff" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#333333" /></marker><marker id="arrowlite" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#777777" /></marker></defs><g id="shared"><rect fill="#e6e6e6" stroke="#333333" stroke-width="1.2" x="270" y="16" width="380" height="46" rx="4" /><text font-family="Times New Roman, Times, serif" font-size="13" fill="#111111" font-weight="700" x="460" y="34" text-anchor="middle">Written procedure: thirteen steps,</text><text font-family="Times New Roman, Times, serif" font-size="13" fill="#111111" font-weight="700" x="460" y="51" text-anchor="middle">22-item report template</text><path fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" d="M380 62 L215 62 L215 96" /><path fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" d="M540 62 L705 62 L705 96" /></g><g id="left"><rect fill="#333333" stroke="#333333" stroke-width="1.2" x="45" y="100" width="340" height="30" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="13.5" fill="#ffffff" font-weight="700" x="215" y="120" text-anchor="middle">Campaign 1   Co/C qualification</text><rect fill="#ffffff" stroke="#333333" stroke-width="1" x="45" y="148" width="340" height="32" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="215" y="169" text-anchor="middle">Two curves: CoC4 and CoC5</text><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="215" y1="180" x2="215" y2="200" /><rect fill="#f5f5f5" stroke="#333333" stroke-width="1" x="45" y="204" width="340" height="52" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="215" y="224" text-anchor="middle">Stage 1: three rounds,</text><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="215" y="242" text-anchor="middle">two fresh sessions per round (six sessions)</text><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="215" y1="256" x2="215" y2="276" /><rect fill="#f5f5f5" stroke="#333333" stroke-width="1" x="45" y="280" width="340" height="52" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="215" y="300" text-anchor="middle">Stage 2: the agent,</text><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="215" y="318" text-anchor="middle">same procedure unchanged (one session)</text><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="215" y1="332" x2="215" y2="402" /><rect fill="#ffffff" stroke="#777777" stroke-width="1" stroke-dasharray="4 3" x="45" y="344" width="150" height="46" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444444" x="120" y="363" text-anchor="middle">Reference:</text><text font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444444" x="120" y="379" text-anchor="middle">expert's withheld fits</text><line stroke="#777777" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowlite)" x1="195" y1="367" x2="213" y2="367" /><rect fill="#e6e6e6" stroke="#333333" stroke-width="1.2" x="45" y="406" width="340" height="118" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" font-weight="700" x="215" y="426" text-anchor="middle">Outcome</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="60" y="446" text-anchor="start">All six stage-1 sessions reproduced the expert's</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="60" y="463" text-anchor="start">thicknesses within 0.03 nm. CoC4 passed every</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="60" y="480" text-anchor="start">criterion in three rounds of three. CoC5 failed</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="60" y="497" text-anchor="start">order 4 in two of three. The agent's two fits</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="60" y="514" text-anchor="start">passed, with its roughness pair swapped.</text></g><g id="right"><rect fill="#333333" stroke="#333333" stroke-width="1.2" x="535" y="100" width="340" height="30" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="13.5" fill="#ffffff" font-weight="700" x="705" y="120" text-anchor="middle">Campaign 2   Ru/C transfer</text><rect fill="#ffffff" stroke="#333333" stroke-width="1" x="535" y="148" width="340" height="32" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="705" y="169" text-anchor="middle">Six curves: RuC1 to RuC5, and the film Ru1</text><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="705" y1="180" x2="705" y2="200" /><rect fill="#f5f5f5" stroke="#333333" stroke-width="1" x="535" y="204" width="340" height="52" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="705" y="224" text-anchor="middle">Round a: six sessions, capped at three fits</text><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="705" y="242" text-anchor="middle">(two sessions stopped by the cap)</text><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="705" y1="256" x2="705" y2="276" /><rect fill="#f5f5f5" stroke="#333333" stroke-width="1" x="535" y="280" width="340" height="52" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="705" y="300" text-anchor="middle">Round b: six sessions,</text><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="705" y="318" text-anchor="middle">the fit cap lifted</text><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="705" y1="332" x2="705" y2="402" /><rect fill="#ffffff" stroke="#777777" stroke-width="1" stroke-dasharray="4 3" x="535" y="344" width="150" height="46" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444444" x="610" y="363" text-anchor="middle">Reference:</text><text font-family="Times New Roman, Times, serif" font-size="11.5" fill="#444444" x="610" y="379" text-anchor="middle">published fits</text><line stroke="#777777" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowlite)" x1="685" y1="367" x2="703" y2="367" /><rect fill="#e6e6e6" stroke="#333333" stroke-width="1.2" x="535" y="406" width="340" height="118" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" font-weight="700" x="705" y="426" text-anchor="middle">Outcome</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="550" y="446" text-anchor="start">Six of twelve sessions passed by their own</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="550" y="463" text-anchor="start">verdict. Every period layer within 0.1 nm of</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="550" y="480" text-anchor="start">the reference. Buffer about 1.4 nm high on</text><text font-family="Times New Roman, Times, serif" font-size="12" fill="#111111" x="550" y="497" text-anchor="start">three fits of eleven.</text></g><g id="footer"><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="215" y1="524" x2="215" y2="546" /><line stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" x1="705" y1="524" x2="705" y2="546" /><rect fill="#ffffff" stroke="#333333" stroke-width="1.2" x="45" y="550" width="830" height="40" rx="3" /><text font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" x="460" y="575" text-anchor="middle">Both campaigns judged against the same six tolerances, fixed before any qualification session ran (Table 2)</text></g></svg>
